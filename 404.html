<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CrashProtocol — Redirecting…</title>
<script>
  // GitHub Pages Clean URL Trick
  // /truck-accidents → /?p=/truck-accidents → index.html handles it
  var path = window.location.pathname;
  var search = window.location.search;
  var hash = window.location.hash;
  var url = '/?p=' + encodeURIComponent(path) +
            (search ? '&q=' + encodeURIComponent(search.slice(1)) : '') +
            hash;
  window.location.replace(url);
</script>
</head>
<body></body>
</html>
